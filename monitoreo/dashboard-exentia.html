  function renderEstadoList(bookings){
    var counts = {reservo:0, asistio:0, pagado:0, no_asistio:0};
    var total = 0;
    bookings.forEach(function(b){
      if(b.estado === 'cancelado') return;
      var s = getDisplayStatus(b);
      if(s === 'hoy' || s === 'vencido' || s === 'confirmado') s = 'reservo';
      if(counts[s] !== undefined){ counts[s]++; total++; }
    });
    $('estado-count').textContent = total;
    var rows = [
      {key:'reservo', label:T.estadoLabels.reservo, count:counts.reservo},
      {key:'asistio', label:T.estadoLabels.asistio, count:counts.asistio},
      {key:'pagado', label:T.estadoLabels.pagado, count:counts.pagado},
      {key:'no_asistio', label:T.estadoLabels.no_asistio, count:counts.no_asistio}
    ];
    var html = '';
    rows.forEach(function(r){
      var pct = total ? Math.round((r.count/total)*100) : 0;
      html += '<div class=' + Q + 'estado-row ' + r.key + Q + '>';
      html += '<div class=' + Q + 'e-head' + Q + '>';
      html += '<div class=' + Q + 'e-name' + Q + '><span class=' + Q + 'e-dot' + Q + '></span>' + esc(r.label) + '</div>';
      html += '<div class=' + Q + 'e-nums' + Q + '>' + r.count + '<span class=' + Q + 'total' + Q + '>/ ' + total + ' · ' + pct + '%</span></div>';
      html += '</div>';
      html += '<div class=' + Q + 'e-track' + Q + '><div class=' + Q + 'e-fill' + Q + ' style=' + Q + 'width:' + pct + '%' + Q + '></div></div>';

  function renderKPIs(bookings){
    var today = todayCancun();
    var d = nowCancun();
    var curYear = d.getFullYear();
    var curMonth = d.getMonth();
    var total = bookings.length;
    var todayCount = bookings.filter(function(b){ return b.fecha_agendada === today; }).length;
    var attended = bookings.filter(function(b){ return b.estado === 'asistio' || b.estado === 'pagado'; }).length;
    var revenue = bookings.reduce(function(sum, b){
      if(b.estado !== 'pagado') return sum;
      if(!b.pago_recibido_at) return sum;
      var pd = new Date(b.pago_recibido_at);
      var mx = new Date(pd.toLocaleString('en-US', {timeZone: TZ}));
      if(mx.getFullYear() !== curYear || mx.getMonth() !== curMonth) return sum;
      var amt = parseFloat(b.total_pagado || b.valor_ticket_mxn || 0);
      return sum + (isNaN(amt) ? 0 : amt);
    }, 0);
    $('kpi-total').textContent = total;
    $('kpi-today').textContent = todayCount;
    $('kpi-attended').textContent = attended;
    $('kpi-revenue').textContent = '$' + revenue.toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  }

  function rpc(fn, args){
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(t); });
      if(r.status === 204) return null;
      return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
  }

  // ===== UBICACIÓN: muestra dirección, link de Maps, copia texto WhatsApp =====
  function buildAddressLine(b) {
    // Si hay direccion_libre, úsala; sino arma desde campos individuales o usa zona
    if (b.direccion_libre && b.direccion_libre.trim()) return b.direccion_libre.trim();
    var parts = [];
    if (b.zona_colonia) parts.push(b.zona_colonia);
    return parts.join(', ') || '—';
  }

  function isCitaDomicilio(b) {
    if (b.modalidad === 'domicilio') return true;
    if (b.direccion_maps_url && b.direccion_maps_url.trim()) return true;
    if (b.direccion_libre && b.direccion_libre.trim()) return true;
    return false;
  }

  function buildWhatsAppText(b, addr, mapsUrl) {
    // Orden de trabajo para el equipo / terapeuta — formato interno, no para el cliente
    var lines = [];
    var modalidad = isCitaDomicilio(b) ? 'A DOMICILIO' : 'EN SUCURSAL';
    lines.push('🎫 ' + (b.booking_code || 'SIN-FOLIO') + ' · ' + modalidad);
    lines.push('👤 ' + (b.cliente_nombre || '—'));
    if (b.cliente_telefono) {
      // Formato +52 998 000 0099
      var tel = String(b.cliente_telefono).replace(/\D/g,'');
      if (tel.startsWith('52') && tel.length >= 12) {
        tel = '+52 ' + tel.slice(2,5) + ' ' + tel.slice(5,8) + ' ' + tel.slice(8);
      } else {
        tel = '+' + tel;
      }
      lines.push('📱 ' + tel);
    }
    var fecha = b.fecha_agendada
      ? new Date(b.fecha_agendada + 'T12:00:00').toLocaleDateString('es-MX', { timeZone: TZ, weekday:'short', day:'numeric', month:'short' })
      : '';
    var hora = b.hora_agendada ? formatTimeDisplay(b.hora_agendada) : '';
    if (fecha) lines.push('📅 ' + fecha + (hora ? ' · ' + hora : ''));
    var svcs = parseServices(b.servicios);
    if (svcs && svcs !== '—') lines.push('💆 ' + svcs);
    lines.push('');
    if (isCitaDomicilio(b)) {
      lines.push('📍 ' + (addr || '—'));
      if (mapsUrl) lines.push('🗺️ ' + mapsUrl);
      if (b.notas_cliente && b.notas_cliente.indexOf('Ref:') !== -1) {
        var ref = b.notas_cliente.split('Ref:')[1] || '';
        if (ref.trim()) lines.push('📝 Ref: ' + ref.replace(/\.$/,'').trim());
      }
    } else {
      lines.push('📍 Plaza Hive · Av. Huayacán, Cancún');
    }
    return lines.join('\n');
  }

  window._exAbrirUbicacion = function(id){
    var b = allBookings.filter(function(x){ return x.id === id; })[0];
    if(!b){ showToast(T.toastError, 'error'); return; }
    var addr = buildAddressLine(b);
    var mapsUrl = b.direccion_maps_url || (b.latitud && b.longitud ? 'https://www.google.com/maps?q=' + b.latitud + ',' + b.longitud : '');
    var isDomicilio = isCitaDomicilio(b);

    // Cliente
    $('ubi-cli-nombre').textContent = b.cliente_nombre || '—';
    $('ubi-cli-tel').textContent = b.cliente_telefono || '—';
    var fechaTxt = b.fecha_agendada ? new Date(b.fecha_agendada + 'T12:00:00').toLocaleDateString('es-MX', { timeZone: TZ, weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '—';
    var hora = b.hora_agendada ? formatTimeDisplay(b.hora_agendada) : '';
    $('ubi-fecha').textContent = fechaTxt + (hora ? ' · ' + hora : '');
    $('ubi-servicios').textContent = parseServices(b.servicios) || '—';

    // Dirección o aviso de sucursal
    if (isDomicilio && addr && addr !== '—') {
      $('ubi-addr-text').textContent = addr;
      var extras = '';
      if (b.zona_colonia && addr.indexOf(b.zona_colonia) === -1) extras += b.zona_colonia;
      if (b.notas_cliente && b.notas_cliente.indexOf('Ref:') !== -1) {
        var ref = b.notas_cliente.split('Ref:')[1] || '';
        if (ref.trim()) extras += (extras ? ' · ' : '') + 'Ref: ' + ref.replace(/\.$/,'').trim();
      }
      $('ubi-addr-extras').textContent = extras;
      $('ubi-addr-extras').style.display = extras ? 'block' : 'none';
      document.querySelector('.ubi-addr-card').style.display = 'flex';
      $('ubi-no-domicilio').style.display = 'none';
      var mapsHref = mapsUrl || ('https://maps.google.com/?q=' + encodeURIComponent(addr));
      $('ubi-maps-link').href = mapsHref;
      $('ubi-maps-link').style.display = 'inline-flex';
    } else {
      document.querySelector('.ubi-addr-card').style.display = 'none';
      $('ubi-no-domicilio').style.display = 'flex';
      $('ubi-maps-link').href = 'https://maps.google.com/?q=Exentia+Spa+Plaza+Hive+Cancun';
      $('ubi-maps-link').style.display = 'inline-flex';
    }

    // Texto WhatsApp
    var waText = buildWhatsAppText(b, addr, mapsUrl);
    $('ubi-preview-text').textContent = waText;

    // Botón WhatsApp se oculta — el mensaje es orden interna del equipo,
    // se copia y se pega manualmente en el grupo de Whatsapp del staff
    $('ubi-whatsapp-link').style.display = 'none';

    // Botón copiar
    $('ubi-copy-btn').onclick = function(){
      var text = $('ubi-preview-text').textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){
          showToast(T.toastCopied, 'success');
        }).catch(function(){
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    };

    openModal('modal-ubicacion');
  };

  function fallbackCopy(text){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(T.toastCopied, 'success');
    } catch (e) {
      showToast(T.toastCopyError, 'error');
    }
  }

  function showToast(msg, type){
    var tc = $('toast-container');
    var t = document.createElement('div');
    t.className = 'toast ' + (type || 'success');
    t.textContent = msg;
    tc.appendChild(t);
    setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(function(){ if(t.parentNode) tc.removeChild(t); },300); }, 3000);
  }

  function escapeCSV(val){
    if(val === null || val === undefined) return '';
    var s = String(val);
    if(s.indexOf(',') !== -1 || s.indexOf(Q) !== -1 || s.indexOf('\n') !== -1 || s.indexOf('\r') !== -1){
      return Q + s.split(Q).join(Q+Q) + Q;
    }
    return s;
  }
  function bookingToCSVRows(b){
    var services = [];
    if(Array.isArray(b.servicios)){
      b.servicios.forEach(function(s){
        var slug = (s && (s.slug || s.name)) || '';
        if(slug.indexOf(',') > -1) slug.split(',').forEach(function(p){ var t=p.trim(); if(t) services.push(t); });
        else if(slug) services.push(slug);
      });
    }
    if(services.length === 0) services = [''];
    return services.map(function(svc){
      return [
        b.booking_code || '', b.cliente_nombre || '', b.cliente_telefono || '', b.cliente_email || '',
        svc, b.fecha_agendada || '', b.hora_agendada || '', b.estado || '',
        b.valor_ticket_mxn || 0, b.modalidad || '', b.notas_cliente || '', b.created_at || ''
      ].map(escapeCSV).join(',');
    });
  }
  $('csv-btn').addEventListener('click', function(){
    var filtered = filterForTable(allBookings);
    var sorted = sortBookings(filtered);
    var rows = [T.csvHeaders];
    sorted.forEach(function(b){ rows = rows.concat(bookingToCSVRows(b)); });
    var csv = '﻿' + rows.join('\r\n');
    var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().substring(0,10);
    a.href = url; a.download = T.csvFilename + '-' + stamp + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    showToast('CSV descargado (' + (rows.length-1) + ' filas)', 'success');
  });

  updateMetaDate();
  fetchBookings();
  setInterval(function(){ updateMetaDate(); fetchBookings(); }, POLL_MS);

  // Fix iframe focus quirk: el primer click se come el foco si el iframe no esta enfocado.
  // Auto-focus al cargar + cada vez que el mouse entra al dashboard.
  try { window.focus(); } catch(e){}
  document.addEventListener('mouseenter', function(){ try { window.focus(); } catch(e){} }, true);
  document.getElementById('ex-dash').addEventListener('mousedown', function(){ try { window.focus(); } catch(e){} }, true);
})();
</script>
"></iframe>
